openapi: 3.1.0
info:
  title: MQ Digital Platform API
  version: 1.0.0
  description: |
    Backend API MQ Mujayarotul Faqih — Pesantren Digital Platform.
    Foto profil (avatar) & cover khatmil dikirim sebagai URL presigned (photo_url / cover_url,
    TTL 15 menit, di-generate inline di endpoint terkait).
    Sumber kontrak: plan gabungan rev 11+ (Bagian I Task 2.1, Bagian III tabel A/B).

    **Konvensi:**
    - Semua response sukses = envelope `{ "data": ..., "meta": { } }`.
    - Semua error = `{ "code": "...", "message": "...", "details?": ... }` dengan HTTP 401/403/404/409/422/429/500.
    - Pagination feed/queue/inbox = **cursor**: `?limit=20&cursor=...` → `meta.pagination = { next_cursor, has_more }`.
    - POST berbiaya (pesan) WAJIB header `Idempotency-Key` (disimpan `client_key` UNIQUE per user — replay 200, baru 201).
    - Waktu = ISO-8601 UTC. ID = BIGINT.
    - Authorization: permission RBAC (`require_permission`), BUKAN role string — lihat docs/permissions.md.
servers:
  - url: https://mq-api.jagodigital.online/api/v1
    description: staging (Bagian II)
  - url: http://127.0.0.1:8290/api/v1
    description: dev lokal

security:
  - bearerAuth: []

tags:
  - {name: app, description: Meta & force-update}
  - {name: auth, description: "Registrasi, login, token, verifikasi"}
  - {name: me, description: Profil & perangkat sendiri}
  - {name: quran, description: Data Al-Quran (read-only) + last-read/bookmark}
  - {name: khatmil, description: Khatmil/khataman campaign}
  - {name: media, description: Upload object storage (presign 3-langkah)}
  - {name: notifications, description: Inbox notifikasi}
  - {name: admin, description: Endpoint admin (users/dashboard/settings/audit)}

paths:
  /app/version:
    get:
      tags: [app]
      summary: Versi minimum app (force-update) — TANPA auth (dicek di splash)
      security: []
      parameters:
        - {name: app_id, in: query, required: true, schema: {enum: [SANTRI_APP, USTADZ_APP, ADMIN_WEB]}}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AppVersion" }

  # ---------------- AUTH ----------------
  /auth/register:
    post:
      tags: [auth]
      summary: Registrasi akun (open; consent PDP dicatat). Default SANTRI; role USTADZ = calon ustadz (login app ustadz; tampil di nearby hanya setelah admin verifikasi ustadz_profiles)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, consent]
              properties:
                phone: {type: string, example: "6281234567890"}
                email: {type: string, format: email}
                password: {type: string, minLength: 8}
                full_name: {type: string}
                consent: {type: boolean, description: "harus true (UU PDP)"}
                role: {type: string, enum: [SANTRI, USTADZ], description: "opsional, default SANTRI; nilai lain 422"}
      responses:
        "201": { $ref: "#/components/responses/Created" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/login:
    post:
      tags: [auth]
      summary: Login (email ATAU phone + password)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                email: {type: string}
                phone: {type: string}
                password: {type: string}
      responses:
        "200":
          description: Token pair
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          access_token: {type: string}
                          refresh_token: {type: string}
                          user: { $ref: "#/components/schemas/UserPublic" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/refresh:
    post:
      tags: [auth]
      summary: Rotasi refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: {type: string}
      responses:
        "200": { description: Token pair baru (rotasi — token lama revoked)", content: { application/json: { schema: { type: object } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/verify-email:
    post:
      tags: [auth]
      summary: Verifikasi email (token dari link — keputusan #14; WA OTP backlog)
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: {type: string}
      responses:
        "200": { description: Akun ACTIVE (bila policy) }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /auth/resend-verification:
    post:
      tags: [auth]
      summary: Kirim ulang email verifikasi (rate-limit terpisah)
      responses:
        "200": { description: Dikirim / queued }
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/forgot-password:
    post:
      tags: [auth]
      summary: Minta token reset (one-time, hashed at rest)
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email: {type: string}
                phone: {type: string}
      responses:
        "200": { description: Selalu OK (anti-enumeration) }
  /auth/reset-password:
    post:
      tags: [auth]
      summary: Reset password dengan token
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token: {type: string}
                new_password: {type: string, minLength: 8}
      responses:
        "200": { description: Berhasil (semua sesi revoked) }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /auth/change-password:
    post:
      tags: [auth]
      summary: Ganti password (login)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [old_password, new_password]
              properties:
                old_password: {type: string}
                new_password: {type: string, minLength: 8}
      responses:
        "200": { description: OK }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /auth/logout:
    post:
      tags: [auth]
      summary: Logout (revoke sesi + nonaktifkan device terkait)
      responses:
        "200": { description: OK }
  /auth/logout-all:
    post:
      tags: [auth]
      summary: Logout semua perangkat (revoke semua sesi + device)
      responses:
        "200": { description: OK }

  # ---------------- ME ----------------
  /me:
    get:
      tags: [me]
      summary: Profil sendiri
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/UserPublic" }
    patch:
      tags: [me]
      summary: Update profil (user_profiles)
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileUpsert" }
      responses:
        "200": { description: OK }
        "422": { $ref: "#/components/responses/Unprocessable" }
    delete:
      tags: [me]
      summary: "Hapus akun (PDP) — status DELETED + anonymize; histori sah dipertahankan"
      responses:
        "200": { description: OK }

  /me/progress/summary:
    get:
      tags: [me]
      summary: Ringkasan progress baca — dipakai profil santri
      responses:
        "200": { description: "OK (agregat dari reading progress)" }

  /me/devices:
    get:
      tags: [me]
      summary: Daftar device terdaftar
      responses:
        "200": { description: OK }
    post:
      tags: [me]
      summary: Daftarkan device push (app_id wajib benar; USTADZ_APP hanya role USTADZ)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [push_token, platform, app_id]
              properties:
                push_token: {type: string}
                platform: {type: string, enum: [ANDROID, IOS, WEB]}
                app_id: {type: string, enum: [SANTRI_APP, USTADZ_APP, ADMIN_WEB]}
                device_name: {type: string}
      responses:
        "201": { $ref: "#/components/responses/Created" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /me/devices/{id}:
    delete:
      tags: [me]
      summary: Hapus device
      parameters: [{name: id, in: path, required: true, schema: {type: integer}}]
      responses:
        "200": { description: OK }
  /me/home:
    get:
      tags: [me]
      summary: "Agregat Home santri (Bagian III M2.5): sapaan + last-read + khatmil saya + notif unread"
      responses:
        "200": { description: "OK — cache 60s, invalidasi on-write" }
  /ustadz/me/home:
    get:
      tags: [me]
      summary: "Agregat Home ustadz: notif unread + kunjungan"
      responses:
        "200": { description: OK }

  /me/ustadz/specializations:
    get:
      tags: [me]
      summary: Spesialisasi ustadz sendiri
      responses:
        "200": { description: OK }
    put:
      tags: [me]
      summary: Set spesialisasi (array category_id)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [category_ids]
              properties:
                category_ids: {type: array, items: {type: integer}}
      responses:
        "200": { description: OK }

  # ---------------- QURAN ----------------
  /quran/surahs:
    get:
      tags: [quran]
      summary: Daftar surah (cache 24h)
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeList"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Surah" }
  /quran/surahs/{id}/ayahs:
    get:
      tags: [quran]
      summary: Ayat per surah (uthmani + imlaei + juz + page)
      security: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, minimum: 1, maximum: 114}}
        - {name: translation, in: query, schema: {type: string, default: KEMENAG}}
        - {name: limit, in: query, schema: {type: integer, default: 50}}
        - {name: cursor, in: query, schema: {type: string}}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeList"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Ayah" }
  /quran/audio:
    get:
      tags: [quran]
      summary: URL audio per ayat (reciter) — file di CDN
      security: []
      parameters:
        - {name: ayah_id, in: query, required: true, schema: {type: integer}}
        - {name: reciter, in: query, schema: {type: string, example: ALAFASY_128KBPS}}
      responses:
        "200": { description: OK }

  /me/reading/last-read:
    get:
      tags: [quran]
      summary: Last-read (1 baris per user)
      responses:
        "200": { description: OK }
    put:
      tags: [quran]
      summary: Set last-read (idempotent upsert)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [ayah_id]
              properties:
                ayah_id: {type: integer}
      responses:
        "200": { description: OK }
  /me/bookmarks:
    get:
      tags: [quran]
      summary: Daftar bookmark
      parameters: [{name: limit, in: query, schema: {type: integer}}, {name: cursor, in: query, schema: {type: string}}]
      responses:
        "200": { description: OK }
    post:
      tags: [quran]
      summary: Tambah bookmark (upsert idempotent)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [ayah_id]
              properties:
                ayah_id: {type: integer}
                note: {type: string}
      responses:
        "201": { $ref: "#/components/responses/Created" }
  /me/bookmarks/{ayah_id}:
    delete:
      tags: [quran]
      summary: Hapus bookmark
      parameters: [{name: ayah_id, in: path, required: true, schema: {type: integer}}]
      responses:
        "200": { description: OK }


  # ---------------- KHATMIL ----------------
  /khatmil/campaigns:
    get:
      tags: [khatmil]
      summary: Daftar campaign (status param)
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [DRAFT, SCHEDULED, ACTIVE, COMPLETED, CANCELLED]}}
      responses:
        "200": { description: OK }
    post:
      tags: [khatmil]
      summary: Buat campaign (admin — khatmil.manage)
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CampaignUpsert" }
      responses:
        "201": { $ref: "#/components/responses/Created" }
  /khatmil/campaigns/{id}:
    get:
      tags: [khatmil]
      summary: Detail campaign + peta juz + progress agregat (cache)
      parameters: [{name: id, in: path, required: true, schema: {type: integer}}]
      responses:
        "200": { description: OK }
    patch:
      tags: [khatmil]
      summary: Update campaign (admin)
      parameters: [{name: id, in: path, required: true, schema: {type: integer}}]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CampaignUpsert" }
      responses:
        "200": { description: OK }
  /khatmil/campaigns/{id}/join:
    post:
      tags: [khatmil]
      summary: Join campaign
      parameters: [{name: id, in: path, required: true, schema: {type: integer}}]
      responses:
        "201": { $ref: "#/components/responses/Created" }
        "409": { $ref: "#/components/responses/Conflict" }
  /khatmil/campaigns/{id}/juz/claim:
    post:
      tags: [khatmil]
      summary: "Klaim juz (ODKU + unique marker-aktif; konflik → 409; body kosong = auto-assign juz kosong)"
      parameters: [{name: id, in: path, required: true, schema: {type: integer}}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                juz: {type: integer, minimum: 1, maximum: 30}
      responses:
        "201": { $ref: "#/components/responses/Created" }
        "409": { $ref: "#/components/responses/Conflict" }
  /khatmil/assignments/{id}/progress:
    post:
      tags: [khatmil]
      summary: "Post progress (pages_read, minutes_read; rate-limit; juz COMPLETED bila memenuhi definisi 0009)"
      parameters: [{name: id, in: path, required: true, schema: {type: integer}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pages_read, minutes_read]
              properties:
                pages_read: {type: integer, minimum: 1, maximum: 22}
                minutes_read: {type: integer, minimum: 1, maximum: 1440}
                note: {type: string}
      responses:
        "201": { $ref: "#/components/responses/Created" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /me/khatmil/assignments:
    get:
      tags: [khatmil]
      summary: Assignment juz saya (semua campaign aktif)
      responses:
        "200": { description: OK }
  /khatmil/campaigns/{id}/participants:
    get:
      tags: [khatmil]
      summary: Peserta campaign (admin/moderasi)
      parameters: [{name: id, in: path, required: true, schema: {type: integer}}]
      responses:
        "200": { description: OK }

  # ---------------- MEDIA (modul 14) ----------------
  /media/uploads:
    post:
      tags: [media]
      summary: "Langkah 1: minta presigned PUT URL (short-lived ≤15 mnt) + row media UPLOADING"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, mime_type, byte_size]
              properties:
                kind: {type: string, enum: [AUDIO, IMAGE, VIDEO, DOCUMENT]}
                mime_type: {type: string, example: audio/mp4}
                byte_size: {type: integer}
                duration_ms: {type: integer}
      responses:
        "201":
          description: media id + upload_url
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/MediaUpload" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /media/uploads/{id}/complete:
    post:
      tags: [media]
      summary: "Langkah 3: konfirmasi upload selesai (server validasi object: magic bytes/MIME/size/duration) → READY"
      parameters: [{name: id, in: path, required: true, schema: {type: integer}}]
      responses:
        "200": { description: READY }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /media/{id}:
    get:
      tags: [media]
      summary: "Metadata + presigned URL fresh (ACL per konteks: pemilik/ustadz berhak/admin — Bagian III keputusan #7)"
      parameters: [{name: id, in: path, required: true, schema: {type: integer}}]
      responses:
        "200": { description: OK — storage_key TIDAK pernah keluar }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------- NOTIFICATIONS ----------------
  /me/notifications:
    get:
      tags: [notifications]
      summary: Inbox notifikasi
      parameters: [{name: unread_only, in: query, schema: {type: boolean}}, {name: limit, in: query, schema: {type: integer}}, {name: cursor, in: query, schema: {type: string}}]
      responses:
        "200": { description: OK }
  /me/notifications/{id}/read:
    post:
      tags: [notifications]
      summary: Tandai dibaca
      parameters: [{name: id, in: path, required: true, schema: {type: integer}}]
      responses:
        "200": { description: OK }
  /me/notifications/read-all:
    post:
      tags: [notifications]
      summary: Tandai semua dibaca
      responses:
        "200": { description: OK }


  # ---------------- ADMIN ----------------
  /admin/users:
    get:
      tags: [admin]
      summary: Daftar pengguna (users.read; filter q/status/role)
      parameters:
        - {name: q, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string}}
        - {name: role, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer}}
        - {name: cursor, in: query, schema: {type: string}}
      responses:
        "200": { description: OK }
  /admin/users/{id}:
    patch:
      tags: [admin]
      summary: Update user (status akun, role, reset kata sandi — users.manage; audit; sandi TIDAK tercatat)
      parameters: [{name: id, in: path, required: true, schema: {type: integer}}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status: {type: string, enum: [PENDING_VERIFICATION, ACTIVE, SUSPENDED, DEACTIVATED]}
                add_role: {type: string}
                remove_role: {type: string}
                password: {type: string, minLength: 8, description: "reset kata sandi — semua sesi perangkat dipaksa keluar"}
      responses:
        "200": { description: OK }
        "404": { description: pengguna tidak ditemukan }
  /admin/dashboard:
    get:
      tags: [admin]
      summary: "Dashboard agregat (dashboard.view): santri aktif, time-series ngaji (activity_events), khatmil progress"
      responses:
        "200": { description: OK }
  /admin/settings:
    get:
      tags: [admin]
      summary: Semua settings (settings.manage)
      responses:
        "200": { description: OK }
  /admin/settings/{key}:
    put:
      tags: [admin]
      summary: Set nilai setting (cache invalidasi on-write)
      parameters: [{name: key, in: path, required: true, schema: {type: string}}]
      requestBody:
        content:
          application/json:
            schema: {type: object}
      responses:
        "200": { description: OK }
  /admin/audit-logs:
    get:
      tags: [admin]
      summary: Query audit log (audit.read; filter actor/module/entity/date)
      parameters:
        - {name: actor_id, in: query, schema: {type: integer}}
        - {name: module, in: query, schema: {type: string}}
        - {name: entity_type, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer}}
        - {name: cursor, in: query, schema: {type: string}}
      responses:
        "200": { description: OK }

  # ---------------- KUNJUNGAN / PESAN USTADZ (santri) ----------------
  /visits/ustadz/nearby:
    get:
      tags: [visits]
      summary: Ustadz terdekat (radius setting visit_radius_km, default 5 km) — hanya ustadz verified + accepting + punya slot & titik lokasi
      parameters:
        - {name: lat, in: query, required: true, schema: {type: number}}
        - {name: lng, in: query, required: true, schema: {type: number}}
      responses:
        "200": { description: OK }
  /visits/slots:
    get:
      tags: [visits]
      summary: Jam terbuka ustadz per tanggal (WIB) — start_time create visit WAJIB dari sini
      parameters:
        - {name: ustadz_id, in: query, required: true, schema: {type: integer}}
        - {name: date, in: query, required: true, schema: {type: string, format: date}}
        - {name: hours, in: query, schema: {type: integer, minimum: 1, maximum: 8}}
      responses:
        "200": { description: OK }
  /visits:
    get:
      tags: [visits]
      summary: Daftar kunjungan saya (santri)
      responses:
        "200": { description: OK }
    post:
      tags: [visits]
      summary: Buat pesanan (wajib header Idempotency-Key; hold slot atomik)
      parameters: [{name: Idempotency-Key, in: header, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ustadz_id, date, start_time, duration_hours]
              properties:
                ustadz_id: {type: integer}
                date: {type: string, format: date, description: WIB}
                start_time: {type: string, example: "09:00"}
                duration_hours: {type: integer, minimum: 1, maximum: 8}
                lat: {type: number, description: kosong = pakai titik rumah}
                lng: {type: number}
                address_label: {type: string}
                note: {type: string}
      responses:
        "201": { description: Created }
        "409": { description: slot diambil / overlap }
        "422": { description: validasi gagal }
  /visits/{id}:
    get:
      tags: [visits]
      summary: Detail kunjungan
      parameters: [{name: id, in: path, required: true, schema: {type: integer}}]
      responses:
        "200": { description: OK }
  /visits/{id}/pay:
    post:
      tags: [visits]
      summary: Bayar via invoice Xendit (retry aman — invoice aktif dipakai ulang)
      parameters: [{name: id, in: path, required: true, schema: {type: integer}}]
      responses:
        "200": { description: OK }
  /visits/{id}/pay-deposit:
    post:
      tags: [visits]
      summary: Bayar dari saldo deposit wallet (409 bila saldo kurang)
      parameters: [{name: id, in: path, required: true, schema: {type: integer}}]
      responses:
        "200": { description: OK }
  /visits/{id}/cancel:
    post:
      tags: [visits]
      summary: Batalkan (santri) — refund penuh bila >= visit_cancel_free_hours (default 2 jam) sebelum jadwal
      parameters: [{name: id, in: path, required: true, schema: {type: integer}}]
      responses:
        "200": { description: OK }
  /visits/{id}/review:
    get:
      tags: [visits]
      summary: Status penilaian double-blind (isi lawan terlihat setelah kedua arah / window)
      parameters: [{name: id, in: path, required: true, schema: {type: integer}}]
      responses:
        "200": { description: OK }
    post:
      tags: [visits]
      summary: Kirim penilaian (rating 1-5 + komentar; immutable)
      parameters: [{name: id, in: path, required: true, schema: {type: integer}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating: {type: integer, minimum: 1, maximum: 5}
                comment: {type: string}
      responses:
        "201": { description: Created }
  /visits/{id}/messages:
    get:
      tags: [visits]
      summary: Chat kunjungan (aktif saat CONFIRMED/IN_PROGRESS)
      parameters: [{name: id, in: path, required: true, schema: {type: integer}}]
      responses:
        "200": { description: OK }
    post:
      tags: [visits]
      summary: Kirim chat
      parameters: [{name: id, in: path, required: true, schema: {type: integer}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: {type: string}
      responses:
        "201": { description: Created }
  /visits/ustadz/{id}/reviews:
    get:
      tags: [visits]
      summary: Review publik ustadz (hanya yang revealed)
      parameters: [{name: id, in: path, required: true, schema: {type: integer}}]
      responses:
        "200": { description: OK }

  # ---------------- KUNJUNGAN (ustadz) ----------------
  /ustadz/visits:
    get:
      tags: [visits]
      summary: Kunjungan ustadz (incoming + upcoming + history)
      responses:
        "200": { description: OK }
  /ustadz/visits/settings:
    get:
      tags: [visits]
      summary: Pengaturan kunjungan (menerima, kapasitas, tarif/jam min 10rb)
      responses:
        "200": { description: OK }
    put:
      tags: [visits]
      summary: Simpan pengaturan kunjungan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                is_accepting: {type: boolean}
                max_active_visits: {type: integer}
                price_per_hour: {type: integer, minimum: 10000}
      responses:
        "200": { description: OK }
  /ustadz/visit/availability:
    get:
      tags: [visits]
      summary: Ketersediaan mingguan + tanggal libur
      responses:
        "200": { description: OK }
  /ustadz/visit/availability/slots:
    post:
      tags: [visits]
      summary: Tambah rentang mingguan (weekday 0=Minggu..6=Sabtu; menit dari 00:00; maks 3 rentang/hari; min 1 jam; anti tumpang tindih 409)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [weekday, start_minute, end_minute]
              properties:
                weekday: {type: integer, minimum: 0, maximum: 6}
                start_minute: {type: integer, minimum: 0}
                end_minute: {type: integer, maximum: 1440}
      responses:
        "201": { description: Created }
  /ustadz/visit/availability/slots/{id}:
    delete:
      tags: [visits]
      summary: Hapus rentang mingguan
      parameters: [{name: id, in: path, required: true, schema: {type: integer}}]
      responses:
        "200": { description: OK }
  /ustadz/visit/availability/blackouts:
    post:
      tags: [visits]
      summary: Tambah tanggal libur (menimpa jadwal mingguan)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [off_date]
              properties:
                off_date: {type: string, format: date}
                note: {type: string}
      responses:
        "201": { description: Created }
  /ustadz/visit/availability/blackouts/{date}:
    delete:
      tags: [visits]
      summary: Hapus tanggal libur
      parameters: [{name: date, in: path, required: true, schema: {type: string, format: date}}]
      responses:
        "200": { description: OK }
  /ustadz/visits/{id}/confirm:
    post:
      tags: [visits]
      summary: Terima pesanan (kapasitas + overlap dicek — 409 bentrok)
      parameters: [{name: id, in: path, required: true, schema: {type: integer}}]
      responses:
        "200": { description: OK }
  /ustadz/visits/{id}/decline:
    post:
      tags: [visits]
      summary: Tolak pesanan (wajib alasan; dana santri kembali)
      parameters: [{name: id, in: path, required: true, schema: {type: integer}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string}
      responses:
        "200": { description: OK }
  /ustadz/visits/{id}/start:
    post:
      tags: [visits]
      summary: "Mulai kunjungan / check-in: CONFIRMED -> IN_PROGRESS (catat started_at, notif santri). Jendela normal: H-30 mnt s.d. jadwal+durasi+24 jam"
      parameters: [{name: id, in: path, required: true, schema: {type: integer}}]
      responses:
        "200": { description: OK }
        "409": { description: status bukan CONFIRMED }
        "422": { description: di luar jendela waktu (aturan bisa dilonggarkan via MQ_VISIT_SCHEDULE_RULES_ENABLED) }
  /ustadz/visits/{id}/complete:
    post:
      tags: [visits]
      summary: "Tandai selesai (CONFIRMED/IN_PROGRESS -> COMPLETED; penghasilan masuk dompet ustadz). Jendela normal: setelah jadwal+durasi, maks +24 jam"
      parameters: [{name: id, in: path, required: true, schema: {type: integer}}]
      responses:
        "200": { description: OK }

  # ---------------- WALLET & PENARIKAN ----------------
  /wallet:
    get:
      tags: [wallet]
      summary: Saldo dompet saya
      responses:
        "200": { description: OK }
  /wallet/topup:
    post:
      tags: [wallet]
      summary: Isi saldo (invoice Xendit topup-{uuid})
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: {type: integer, minimum: 10000}
      responses:
        "200": { description: OK }
  /wallet/transactions:
    get:
      tags: [wallet]
      summary: Mutasi (TOPUP/PAYMENT/REFUND/EARNING/PAYOUT/ADJUST + balance_after)
      responses:
        "200": { description: OK }
  /me/wallet-adjustments:
    get:
      tags: [wallet]
      summary: Penyesuaian saldo dari admin (menunggu ACC saya)
      responses:
        "200": { description: OK }
  /me/wallet-adjustments/{id}/accept:
    post:
      tags: [wallet]
      summary: Setujui penyesuaian (saldo berubah)
      parameters: [{name: id, in: path, required: true, schema: {type: integer}}]
      responses:
        "200": { description: OK }
  /me/wallet-adjustments/{id}/reject:
    post:
      tags: [wallet]
      summary: Tolak penyesuaian
      parameters: [{name: id, in: path, required: true, schema: {type: integer}}]
      responses:
        "200": { description: OK }
  /ustadz/payouts:
    get:
      tags: [wallet]
      summary: Penarikan saya (saldo dikunci sejak pengajuan; min payout_min_amount default 50rb)
      responses:
        "200": { description: OK }
    post:
      tags: [wallet]
      summary: Ajukan penarikan (debit penuh; amount diterima = amount - fee default 6.500)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, bank_name, bank_account_no, bank_account_name]
              properties:
                amount: {type: integer}
                bank_name: {type: string}
                bank_account_no: {type: string}
                bank_account_name: {type: string}
      responses:
        "201": { description: Created }

  # ---------------- PAYMENTS (webhook/dev) ----------------
  /payments/xendit/callback:
    post:
      tags: [payments]
      summary: Webhook Xendit (invoice topup-* / visit-*; idempotent)
      security: []
      responses:
        "200": { description: OK }
  /payments/xendit/simulate:
    post:
      tags: [payments]
      summary: Simulasi bayar (hanya mode mock + dev) — event "paid"/"expired"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [external_id]
              properties:
                external_id: {type: string}
                event: {type: string, enum: [paid, expired]}
      responses:
        "200": { description: OK }

  # ---------------- ADMIN: kunjungan, penarikan, dompet, verifikasi ----------------
  /admin/visits:
    get:
      tags: [admin]
      summary: Semua kunjungan (filter status/ustadz_id/user_id; sort)
      parameters:
        - {name: status, in: query, schema: {type: string}}
        - {name: ustadz_id, in: query, schema: {type: integer}}
        - {name: user_id, in: query, schema: {type: integer}}
        - {name: sort, in: query, schema: {type: string}}
      responses:
        "200": { description: OK }
  /admin/visits/{id}:
    get:
      tags: [admin]
      summary: Detail kunjungan (timeline lengkap)
      parameters: [{name: id, in: path, required: true, schema: {type: integer}}]
      responses:
        "200": { description: OK }
  /admin/visits/{id}/messages:
    get:
      tags: [admin]
      summary: Chat kunjungan read-only (penyelesaian sengketa)
      parameters: [{name: id, in: path, required: true, schema: {type: integer}}]
      responses:
        "200": { description: OK }
  /admin/visits/{id}/force-complete:
    post:
      tags: [admin]
      summary: Paksa selesai (bypass jendela waktu; CONFIRMED/IN_PROGRESS -> COMPLETED + penghasilan)
      parameters: [{name: id, in: path, required: true, schema: {type: integer}}]
      responses:
        "200": { description: OK }
  /admin/visits/{id}/force-cancel:
    post:
      tags: [admin]
      summary: Paksa batal (wajib alasan; refund_override opsional)
      parameters: [{name: id, in: path, required: true, schema: {type: integer}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string}
                refund_override: {type: boolean}
      responses:
        "200": { description: OK }
  /admin/ustadz/{id}/verify:
    post:
      tags: [admin]
      summary: Verifikasi ustadz (users.manage) — set/clear ustadz_profiles.verified_at; verified=true sekalian beri role USTADZ. Gate visibilitas di pencarian santri
      parameters: [{name: id, in: path, required: true, schema: {type: integer}}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                verified: {type: boolean, default: true}
      responses:
        "200": { description: OK }
        "404": { description: pengguna tidak ditemukan }
  /admin/payouts:
    get:
      tags: [admin]
      summary: Daftar penarikan (filter status)
      parameters: [{name: status, in: query, schema: {type: string}}]
      responses:
        "200": { description: OK }
  /admin/payouts/{id}/approve:
    post:
      tags: [admin]
      summary: Setujui penarikan (status APPROVED — siap ditransfer)
      parameters: [{name: id, in: path, required: true, schema: {type: integer}}]
      responses:
        "200": { description: OK }
  /admin/payouts/{id}/reject:
    post:
      tags: [admin]
      summary: Tolak penarikan (refund penuh = amount + fee)
      parameters: [{name: id, in: path, required: true, schema: {type: integer}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string}
      responses:
        "200": { description: OK }
  /admin/payouts/mark-transferred:
    post:
      tags: [admin]
      summary: Tandai sudah ditransfer (bulk ids)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payout_ids]
              properties:
                payout_ids: {type: array, items: {type: integer}}
      responses:
        "200": { description: OK }
  /admin/wallet:
    get:
      tags: [admin]
      summary: Saldo semua pengguna (filter q/role SANTRI|USTADZ)
      parameters:
        - {name: q, in: query, schema: {type: string}}
        - {name: role, in: query, schema: {type: string, enum: [SANTRI, USTADZ]}}
      responses:
        "200": { description: OK }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Created:
      description: Created (201)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
    Unauthorized:
      description: Token hilang/expired
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: "Tidak punya permission / gate (ustadz belum verified, akun belum ACTIVE, app_update_required)"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Tidak ditemukan
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Konflik (juz sudah diklaim, dsb)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unprocessable:
      description: Validasi gagal
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Terlalu banyak request (429)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: {type: string, example: conflict}
        message: {type: string}
        details: {}
    Envelope:
      type: object
      required: [data]
      properties:
        data: {}
        meta:
          type: object
          properties:
            pagination:
              type: object
              properties:
                next_cursor: {type: [string, "null"]}
                has_more: {type: boolean}
    EnvelopeList:
      type: object
      required: [data]
      properties:
        data: {type: array, items: {}}
        meta:
          type: object
    AppVersion:
      type: object
      properties:
        app_id: {type: string}
        min_build: {type: integer}
        latest_build: {type: integer}
        update_required: {type: boolean}
        url_apk: {type: [string, "null"]}
    UserPublic:
      type: object
      properties:
        id: {type: integer}
        phone: {type: [string, "null"]}
        email: {type: [string, "null"]}
        account_type: {type: string}
        status: {type: string}
        roles: {type: array, items: {type: string}}
        full_name: {type: [string, "null"]}
        photo_media_id: {type: [integer, "null"]}
    ProfileUpsert:
      type: object
      properties:
        full_name: {type: string}
        gender: {type: string, enum: [MALE, FEMALE]}
        birth_date: {type: string, format: date}
        address_text: {type: string}
        city: {type: string}
        province: {type: string}
        photo_media_id: {type: integer}
        bio: {type: string}
    Surah:
      type: object
      properties:
        id: {type: integer}
        name_arabic: {type: string}
        name_latin: {type: string}
        name_id: {type: string}
        ayah_count: {type: integer}
        revelation: {type: string, enum: [MAKKAH, MADINAH]}
    Ayah:
      type: object
      properties:
        id: {type: integer}
        surah_id: {type: integer}
        ayah_number: {type: integer}
        text_uthmani: {type: string}
        text_imlaei: {type: [string, "null"]}
        juz: {type: integer}
        hizb: {type: [integer, "null"]}
        page: {type: integer}
        sajda: {type: boolean}
        translation: {type: [string, "null"]}
    MediaUpload:
      type: object
      properties:
        media_id: {type: integer}
        upload_url: {type: string, description: presigned PUT S3 ≤15 menit}
        expires_at: {type: string, format: date-time}
    CampaignUpsert:
      type: object
      properties:
        slug: {type: string}
        name: {type: string}
        description: {type: string}
        mode: {type: string, enum: [PARALLEL, SEQUENTIAL]}
        target_khataman: {type: integer}
        period_start: {type: string, format: date}
        period_end: {type: string, format: date}
        min_minutes_per_juz: {type: integer, minimum: 1, maximum: 600}
        require_manual_verification: {type: boolean}
        max_participants: {type: [integer, "null"]}
